title:
  name: "Mayor"
  # Dynamic root alias derived from title.name (example: /king -> /mayor).
  # Disabled automatically if the alias conflicts with reserved/common commands.
  command_alias_enabled: true
  player_prefix: "<gold><bold>%title_name%</bold></gold>"
  # If true, MayorSystem applies/removes the group below for the elected player.
  # Requires LuckPerms. If the group does not exist, MayorSystem auto-creates it.
  # Usually the only external setup needed is LuckPerms meta-formatting plus
  # any prefix/meta you want on this group.
  # Step-by-step guide:
  # https://github.com/Louguerrier22/MayorSystem/blob/main/docs/LUCKPERMS_SETUP.md
  username_group_enabled: true
  username_group: "mayor_current"
  chat_prefix: "<gold><bold>%title_name%</bold></gold> <dark_gray>>></dark_gray> "

display_reward:
  enabled: true
  default_mode: "RANK"
  permissions:
    admin_view: "mayor.admin.reward.view"
    admin_edit: "mayor.admin.reward.edit"
  rank:
    enabled: true
    luckperms_group: "mayor_current"
    auto_create_group: true
  tag:
    enabled: false
    deluxe_tag_id: "mayor_current"
    display: "&6[%title_name%]"
    description: "Awarded to the only %title_name%"
    order: 100
    permission: "DeluxeTags.Tag.mayor_current"
    auto_create_if_supported: true
    select_when_applied: true
    clear_when_removed: true
    render_before_luckperms: true
  targets:
    tracks: {}
    groups: {}
    users: {}

enabled: true          # master switch (kills everything if false)
public_enabled: true   # NEW: disables mayor system for regular players only

# Which subsystems are affected when enabled=false.
# Options: SCHEDULE, ACTIONS, PERKS, MAYOR_NPC, BROADCASTS
enable_options:
  - SCHEDULE
  - ACTIONS
  - PERKS
  - MAYOR_NPC
  - BROADCASTS

pause:
  enabled: false       # pause elections/term schedule without disabling the plugin
  # Which subsystems are affected when paused=true.
  # Options: SCHEDULE, ACTIONS, PERKS, MAYOR_NPC, BROADCASTS
  options:
    - SCHEDULE
    - ACTIONS
    - PERKS
    - MAYOR_NPC
    - BROADCASTS

data:
  store:
    # Storage backend: "sqlite" or "mysql"
    type: "sqlite"
    sqlite:
      file: "elections.db"
      async_writes: false
      # If true, all writes are forced to be synchronous (safer, but blocks the caller thread).
      strict: true
      journal_mode: "WAL"
      synchronous: "NORMAL"
      busy_timeout_ms: 2000
    mysql:
      host: "localhost"
      port: 3306
      database: "mayorsystem"
      user: "CHANGE_ME"
      password: "CHANGE_ME"
      use_ssl: true
      server_timezone: "UTC"
      params: ""
      # Connection pool size (HikariCP). Increase for busy servers.
      pool_size: 4
      async_writes: true
      strict: true


term:
  length: "P14D"                 # ISO-8601 Duration (14 days)
  vote_window: "P3D"             # voting window duration
  election_after_term_end: false # true = voting starts after term ends (gap before next term)
  first_term_start: "9999-12-31T23:59:59-05:00"  # OffsetDateTime
  perks_per_term: 2

  bonus_term:
    enabled: true
    every_x_terms: 4
    perks_per_bonus_term: 4

apply:
  playtime_minutes: 600
  cost: 1000

election:
  # If true, players can change their vote any time before voting closes.
  allow_vote_change: true

  # Optional UX: announce when elections become open.
  # Uses store flags to avoid spamming every tick/restart.
  broadcast:
    enabled: true
    mode: "TITLE"   # TITLE, CHAT, or BOTH
    vote:
      mode: "CHAT"    # DISABLED, CHAT, TITLE, or BOTH
      # Defaults use formatted display names.
      # Use %player_name% / %candidate_name% if you need raw compatibility-safe names.
      chat_lines:
        - "<yellow>%player_display_name%</yellow> <gray>just voted for next %title_name_lower%</gray>"
          # Use %candidate_display_name% to show the voted-for candidate by default.
      title: "<gold>%player_display_name%</gold> <gray>voted for</gray> <yellow>%candidate_display_name%</yellow>"
      subtitle: "<gray>Term #%term% election activity</gray>"
    apply:
      mode: "DISABLED"  # DISABLED, CHAT, TITLE, or BOTH
      # Defaults use the formatted display name. Use %player_name% for the raw name.
      chat_lines:
        - "<yellow>%player_display_name%</yellow> <gray>just applied for next %title_name_lower%.</gray>"
      title: "<gold>%player_display_name%</gold> <gray>applied for next %title_name%</gray>"
      subtitle: "<gray>Term #%term% election activity</gray>"

    # Message templates (MiniMessage, plus PlaceholderAPI if installed)
    open:
      chat_lines:
        # These are the body lines only.
        # MayorSystem wraps them with a bold/gold header + footer so they stand out.
        - "<yellow><bold>Elections are now OPEN!</bold></yellow> <gray>(Term #%term%)</gray>"
        - "<gray>Vote now: <yellow>/%title_command% vote</yellow> or open the %title_name% menu.</gray>"
      title: "<yellow><bold>Elections Open!</bold></yellow>"
      subtitle: "<gray>Vote now with <yellow>/%title_command%</yellow></gray>"

    elected:
      # Defaults use the formatted mayor display name. Use %mayor_name% for the raw winner name.
      chat_lines:
        # Body lines only (wrapped by MayorSystem).
        - "<green><bold>New %title_name% elected!</bold></green> <gray>(Term #%term%)</gray>"
        - "<gray>%title_name%:</gray> <yellow>%mayor_display_name%</yellow>"
      title: "<green><bold>New %title_name%!</bold></green>"
      subtitle: "<yellow>%mayor_display_name%</yellow> <gray>(Term #%term%)</gray>"

    no_candidates:
      chat_lines:
        - "<red>Election extended</red> <gray>(no players applied)</gray> <gray>(Term #%term%)</gray> <yellow>Apply now:</yellow> <white>/%title_command% apply</white>"
      # Legacy key still accepted for backwards compatibility.
      chat: "<red>Election extended</red> <gray>(no players applied)</gray> <gray>(Term #%term%)</gray> <yellow>Apply now:</yellow> <white>/%title_command% apply</white>"
      title: "<red><bold>Election Extended</bold></red>"
      subtitle: "<gray>No players applied.</gray> <yellow>Apply now: /%title_command% apply</yellow>"

    title:
      fade_in_ms: 500
      stay_ms: 4000
      fade_out_ms: 800

  # How to resolve a tie (same highest vote count):
  # - SEEDED_RANDOM
  # - INCUMBENT
  # - EARLIEST_APPLICATION
  # - ALPHABETICAL
  tie_policy: "SEEDED_RANDOM"

  # Candidate step-down rules.
  stepdown:
    allow_reapply: false

  # Mayor step-down (mid-term) behavior:
  # - OFF: disabled
  # - NO_MAYOR: clear mayor + perks until next term
  # - KEEP_MAYOR: keep current mayor until new term
  mayor_stepdown: "OFF"

sell_bonus:
  enabled: true
  # How multiple multipliers stack when multiple sell perks are selected:
  # MAX or PRODUCT
  stack_mode: "MAX"
  # How the "All" sell perk stacks with category perks:
  # - true  => All bonus applies on top of category bonuses (stacked)
  # - false => All bonus applies only to items with no active category bonus
  all_bonus_stack: true

custom_requests:
  # Max custom perk requests a player can submit for a given term.
  limit_per_term: 2

  # Who can request a custom perk:
  # - DISABLED         -> custom perk requests are disabled
  # - NONE             -> any candidate can request
  # - ELECTED_ONCE     -> must have been elected mayor at least once in the past
  # - APPLY_REQUIREMENTS -> must meet apply requirements (currently: playtime threshold)
  request_condition: "APPLY_REQUIREMENTS"

ux:
  # How long a chat prompt session can sit idle before it automatically expires.
  # This prevents players from being "stuck" in a prompt hours later.
  chat_prompt_timeout_seconds: 300

  # Max character lengths for chat prompts.
  # These are hard caps to prevent chat spam / huge config strings.
  chat_prompts:
    max_length:
      # Candidate bio (shown on candidate cards)
      bio: 50
      # Custom perk request title
      title: 50
      # Custom perk request description
      description: 50


skins:
  # Delay before writing skins-cache.json after updates.
  cache_save_delay_ticks: 60

perks:
  enabled: true
  # How many players to refresh per tick when reapplying perk effects.
  refresh_batch_size: 20
  command_execution:
    # If false, non-effect perk commands are never dispatched from console.
    enable_console_commands: true
    # Dangerous command roots are blocked unless explicitly allowed here.
    # Example: ["lp"] if you intentionally need LuckPerms commands in perks.
    allow_roots: []

  sections:
    # Per-section rules:
    #   pick_limit      — max perks selectable from this section (0 = unlimited)
    #   pick_min_limit  — min perks that MUST be picked from this section (0 = optional).
    #                     Sum of all minima must stay <= term.perks_per_term (health check enforced).
    # Per-perk extras:
    #   drop_modifier   — optional loot-curse probability [0.01..1.0]: chance a single
    #                     lore entry still drops while the perk is active (e.g. 0.81
    #                     = the mayor's 19% VAT). Only applies to mob-kill loot.
    # --- Hafercraft catalog ---------------------------------------------------
    # Candidates must pick at least one boon AND one curse per term
    # (pick_min_limit = 1 on both sides). Exactly 8 enabled perks per side;
    # the rest sits on a disabled bench. Everything is console-command based
    # (potion effects via the interceptor, gamerules, give/xp) and safe with
    # perks.command_execution.allow_roots = [].
    boons:
      enabled: true
      pick_limit: 0      # 0 = unlimited
      pick_min_limit: 1  # at least one boon per term (mandatory side A)
      display_name: "<gradient:#43cea2:#185a9d>Segnungen</gradient>"
      icon: "POTION"
      perks:
        speed_1:
          enabled: true
          display_name: "<aqua>Tempo I</aqua>"
          icon: "SUGAR"
          lore:
            - "<gray>Alle Bürger erhalten Tempo I für die ganze Amtszeit.</gray>"
            - "<dark_gray>Ein kleines Dauer-Buff mit großem Effekt.</dark_gray>"
          on_start:
            - "effect give @a minecraft:speed infinite 0 true"
          on_end:
            - "effect clear @a minecraft:speed"

        haste_1:
